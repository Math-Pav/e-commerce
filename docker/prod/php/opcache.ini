; OPcache en production : PHP garde le code compilé en mémoire au lieu de relire et recompiler
; chaque fichier à chaque requête.
; Réglages recommandés par Symfony : https://symfony.com/doc/current/performance.html

opcache.enable = 1
; Mémoire réservée au code compilé (Mo) et nombre maximal de fichiers en cache
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Le code ne change jamais dans un conteneur de production (il est dans l'image) :
; inutile de vérifier à chaque requête si un fichier a été modifié. Un déploiement = un nouveau conteneur.
opcache.validate_timestamps = 0

; Préchargement : au démarrage de PHP-FPM, les classes les plus utilisées de Symfony sont chargées une fois
; pour toutes en mémoire (liste générée par cache:warmup, lue par config/preload.php).
opcache.preload = /var/www/html/config/preload.php
opcache.preload_user = www-data

; Cache des chemins de fichiers résolus (évite des appels système répétés)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
