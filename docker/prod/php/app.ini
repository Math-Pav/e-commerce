; Réglages PHP de production, ajoutés au php.ini-production de l'image officielle.

; Ne pas annoncer la version de PHP dans l'en-tête X-Powered-By
expose_php = Off

; Les erreurs ne sont jamais affichées au visiteur ; elles partent dans le journal du conteneur
; (docker compose logs php).
display_errors = Off
log_errors = On

; Fuseau horaire du serveur (les dates de l'application sont en heure de Paris)
date.timezone = Europe/Paris

; Photos des produits : 2 Mo maximum (ADR 0010). Ce sont les valeurs par défaut de PHP,
; écrites ici pour être visibles ; la vraie limite, avec un message clair, est vérifiée par Symfony.
upload_max_filesize = 2M
post_max_size = 8M

; Cookie de session inaccessible au JavaScript
session.cookie_httponly = On
