; Pool PHP-FPM de production (complète /usr/local/etc/php-fpm.d/www.conf de l'image officielle).
[www]
; Nombre de processus PHP adapté à la charge : entre 2 et 10 selon le trafic.
; À ajuster selon la mémoire du serveur (compter environ 50 Mo par processus).
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Un processus est recyclé après 500 requêtes (limite l'effet d'une éventuelle fuite de mémoire)
pm.max_requests = 500

; Les variables d'environnement du conteneur (APP_SECRET, DATABASE_URL…) sont transmises à PHP.
clear_env = no

; Pas de journal d'accès côté PHP : Nginx journalise déjà chaque requête.
access.log = /dev/null
