# Nginx de PRODUCTION : même principe que docker/nginx/default.conf (développement),
# avec en plus la compression, le cache navigateur des ressources et des en-têtes de sécurité.
# HTTPS n'est pas géré ici : il est assuré par un proxy placé devant (voir docs/deploiement.md).
server {
    listen 80;

    root /var/www/html/public;

    # Ne pas afficher la version de Nginx dans les réponses et les pages d'erreur
    server_tokens off;

    # Même limite qu'en développement (photos de 2 Mo + marge pour l'encodage multipart)
    client_max_body_size 3m;

    # En-têtes de sécurité envoyés avec chaque réponse
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression des réponses texte (HTML, CSS, JS, JSON)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    # Vérification de santé de Nginx lui-même (utilisée par le healthcheck de compose.prod.yaml)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ressources compilées par asset-map:compile : leur nom contient une empreinte du contenu
    # (ex. app-3f2a9c1.css), un nouveau contenu = un nouveau nom. Le navigateur peut donc les garder un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Photos des produits : volume partagé avec PHP. Jamais exécutées, seulement servies.
    location /uploads/ {
        expires 7d;
        try_files $uri =404;
    }

    # Fichiers cachés (.htaccess, .git…) : refusés
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
