server {
    listen 80;

    # Seul le dossier public/ est exposé : le reste du code n'est pas accessible depuis le navigateur
    root /var/www/html/public;

    # Taille maximale d'une requête (1 Mo par défaut). Les photos de produits vont jusqu'à 2 Mo (ADR 0010) :
    # 3 Mo laissent de la marge pour l'encodage multipart (séparateurs, en-têtes de chaque champ) et les autres
    # champs du formulaire. La vraie limite de 2 Mo est vérifiée par Symfony, avec un message clair.
    client_max_body_size 3m;

    # Fichier existant (CSS, images…) servi directement, sinon tout passe par le contrôleur frontal
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Le contrôleur frontal de Symfony est transmis à PHP-FPM (service "php", port 9000)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Tout autre fichier .php est refusé
    location ~ \.php$ {
        return 404;
    }
}
