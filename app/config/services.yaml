# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Expéditeur de tous les e-mails envoyés aux clients (domaine .test : réservé, jamais réel)
    app.mailer.sender_email: 'boutique@atelier-papier.test'
    app.mailer.sender_name: 'Atelier Papier'
    # Dossier des photos de produits, servi par Nginx à l'adresse /uploads/products/ (voir ADR 0010)
    app.product_images_directory: '%kernel.project_dir%/public/uploads/products'
    # Vendeur imprimé sur les factures (ADR 0018). Données fictives : projet d'apprentissage.
    app.invoice.seller_name: 'Atelier Papier SAS'
    app.invoice.seller_address: '8 rue de la Papeterie'
    app.invoice.seller_postal_code: '69002'
    app.invoice.seller_city: 'Lyon'
    app.invoice.seller_siret: '12345678900017'
    app.invoice.seller_vat_number: 'FR40123456789'
    # Taux de TVA appliqué à tous les produits, en pourcentage entier (les prix du site sont TTC)
    app.invoice.vat_rate: 20
    # Délai, en minutes, après lequel une commande non payée est annulée automatiquement
    # par la commande console app:orders:cancel-expired (ADR 0024)
    app.order.payment_delay_minutes: 60

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        # Les tests enregistrent leurs photos à part, pour ne jamais toucher à celles du développement
        app.product_images_directory: '%kernel.project_dir%/var/test/uploads/products'
