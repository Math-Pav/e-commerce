security:
    # Algorithme de hachage choisi automatiquement par Symfony (le plus robuste disponible)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Où trouver les utilisateurs : dans la table user, en cherchant par e-mail
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: product_index
            logout:
                path: app_logout
                target: product_index

    # Un administrateur possède aussi tous les droits d'un client
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # Filet de sécurité global : toute adresse commençant par /admin exige ROLE_ADMIN
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

# En test, hachage volontairement faible pour que les tests restent rapides
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10