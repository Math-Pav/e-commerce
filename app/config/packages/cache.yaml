framework:
    cache:
        # Le cache "app" est stocké dans des fichiers (var/share/<env>/pools/app) : rien à installer.
        pools:
            # Résultats de calculs coûteux (statistiques, filtres du catalogue), voir docs/adr/0019-cache-applicatif.md.
            # tags: true permet d'invalider d'un coup toutes les entrées portant une étiquette.
            # La durée de vie par défaut (1 h) n'est qu'un filet de sécurité : l'invalidation se fait par étiquette.
            # Autowiring : TagAwareCacheInterface $computedCache
            computed.cache:
                adapter: cache.app
                tags: true
                default_lifetime: 3600
